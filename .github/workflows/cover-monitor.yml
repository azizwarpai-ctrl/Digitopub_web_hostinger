name: Cover monitor

# Hourly check that every journal cover loads on digitopub.com (#239).
# Covers broke three times without anyone noticing; this opens (or updates)
# one GitHub issue labelled `cover-monitor` when any cover fails, and closes
# it once they all load again. Needs no secrets: it only reads public URLs.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: cover-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.10

      - name: Check covers
        id: check
        run: |
          set +e
          bun run scripts/check-covers.ts > report.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the alert issue
        if: steps.check.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create cover-monitor --color B60205 --description "Opened by the cover monitor workflow" 2>/dev/null || true
          issue=$(gh issue list --label cover-monitor --state open --json number --jq '.[0].number')
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf '\n\nWorkflow run: %s\n' "$run_url" >> report.md
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file report.md
          else
            gh issue create --title "Cover monitor: journal covers are not loading on digitopub.com" --label cover-monitor --body-file report.md
          fi
          exit 1

      - name: Close the alert issue when covers load again
        if: steps.check.outputs.exit == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue=$(gh issue list --label cover-monitor --state open --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "$(cat report.md)"
          fi
