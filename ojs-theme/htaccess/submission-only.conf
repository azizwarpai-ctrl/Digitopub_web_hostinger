# ----- Submission-only SubmitManager (#183) -----
# Reader-facing OJS pages 301 to their DigitoPub equivalents. SubmitManager
# keeps ONLY submission, editorial workflow and file storage.
#
# Deploy: paste this block into public_html/.htaccess AFTER the #175
# article/view rule and BEFORE the front-controller rewrite. The source of
# truth is ojs-theme/htaccess/submission-only.conf; it is evaluated by
# tests/unit/ojs-submission-only-redirects.test.ts, so keep to the syntax the
# test understands: RewriteCond on %{QUERY_STRING} only, and every
# RewriteRule [R=301,L,...] to https://digitopub.com/.
#
# Deliberately NOT redirected (must keep working): login, user/*,
# submission/*, submissions, dashboard, workflow, management, stats,
# $$$call$$$, api/*, about/submissions, about/contact, publication-fees,
# article/download, issue/download, preview, oai, payment, notification,
# public/*, the bridge/SSO PHP files, and the journal/site home pages
# (stripped to a submission portal by the theme instead).
# issue/view/{id} needs a DB lookup (volume/number) and is redirected by
# DigitopubThemePlugin::redirectIssuePage.
#
# Journal rules use ^(?!index/) so the site-level "index" context is never
# sent to a non-existent /journals/index page.

# Search (journal or site-wide) -> DigitoPub search, carrying the query.
RewriteCond %{QUERY_STRING} (?:^|&)query=([^&]*)
RewriteRule ^([a-z0-9-]+)/search(?:/[a-zA-Z]+)?/?$ https://digitopub.com/search?q=%1 [R=301,L,NE]
RewriteRule ^([a-z0-9-]+)/search(?:/[a-zA-Z]+)?/?$ https://digitopub.com/search [R=301,L,QSD]

# Issues & archive
RewriteRule ^(?!index/)([a-z0-9-]+)/issue/archive(?:/[0-9]+)?/?$ https://digitopub.com/journals/$1/archive [R=301,L,QSD]
RewriteRule ^(?!index/)([a-z0-9-]+)/issue/current/?$ https://digitopub.com/journals/$1/current-issue [R=301,L,QSD]

# About & masthead (about/submissions and about/contact stay on OJS)
RewriteRule ^(?!index/)([a-z0-9-]+)/about/?$ https://digitopub.com/journals/$1 [R=301,L,QSD]
RewriteRule ^(?!index/)([a-z0-9-]+)/about/(?:editorialMasthead|editorialTeam)/?$ https://digitopub.com/journals/$1/about-journal/editorial-board [R=301,L,QSD]
RewriteRule ^(?!index/)([a-z0-9-]+)/about/privacy/?$ https://digitopub.com/journals/$1/policies/privacy-statement [R=301,L,QSD]

# Custom navigation-menu pages (paths inventoried across all 13 journals)
RewriteRule ^(?!index/)([a-z0-9-]+)/(?:journal-information|journalinformation|browse)/?$ https://digitopub.com/journals/$1 [R=301,L,QSD]
RewriteRule ^(?!index/)([a-z0-9-]+)/(editorial-board|advisory-board|aims-scope)/?$ https://digitopub.com/journals/$1/about-journal/$2 [R=301,L,QSD]
RewriteRule ^(?!index/)([a-z0-9-]+)/(?:author-guidelines|for-authors)/?$ https://digitopub.com/journals/$1/author-guidelines [R=301,L,QSD]

# Policy pages — slugs match DigitoPub's policy tabs (#182)
RewriteRule ^(?!index/)([a-z0-9-]+)/(?:policies|journal-policies)/?$ https://digitopub.com/journals/$1/policies [R=301,L,QSD]
RewriteRule ^(?!index/)([a-z0-9-]+)/copyright-licensing-policies/?$ https://digitopub.com/journals/$1/policies/copyright-licensing [R=301,L,QSD]
RewriteRule ^(?!index/)([a-z0-9-]+)/(policies-on-ethics|editorial-workflow|indexing-archiving|dois-orcid|repository-policy)/?$ https://digitopub.com/journals/$1/policies/$2 [R=301,L,QSD]
# Any other policy page: land on the Policies tab (its DigitoPub slug may be
# an alias, e.g. privacy-policy -> privacy-statement, so don't guess it).
RewriteRule ^(?!index/)([a-z0-9-]+)/[a-z0-9-]*polic[a-z0-9-]*/?$ https://digitopub.com/journals/$1/policies [R=301,L,QSD]
# ----- end submission-only (#183) -----
